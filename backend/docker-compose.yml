version: '3.8'

services:
  sentinel-gateway:
    build: .
    container_name: llama_guard_sentinel_proxy
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config     # Persists policy threshold matrices live
      - ./src:/app/src           # Mounts active codebase edits instantly
      - ./telemetry:/app/telemetry
    env_file:
      - .env                     # Dynamically loads all secure environment configuration profiles
    environment:
      - PYTHONPATH=/app
      - META_MODEL_API_BASE_URL=https://inference.baseten.co/v1
      - HACKATHON_MODEL_ID=meta-models/muse-spark-open-1026
      - LOCAL_OPEN_WEIGHTS_MODEL_ID=llama-3-8b-instruct-local
      - LOCAL_COMPUTE_PROVIDER=local-mesh-edge
    restart: unless-stopped
